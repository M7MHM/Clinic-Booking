services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ClinicDb;Username=postgres;Password=clinicpassword
      Redis__ConnectionString: redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: ClinicDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clinicpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clinic-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: